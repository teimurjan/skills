<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Your Appname code</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ .Token }} is your Appname code.</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#fafafa;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 4px 16px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#0a0a0a;">Appname</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;padding:28px 24px;">
            <p style="margin:0 0 8px;font-family:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#737373;">Sign-in code</p>
            <p style="margin:0 0 20px;font-family:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;font-size:36px;font-weight:600;letter-spacing:0.18em;line-height:1.2;color:#0a0a0a;">{{ .Token }}</p>
            <p style="margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#525252;">Enter it on the screen where you asked for it. It expires in an hour.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#737373;">Didn’t ask for a code? Ignore this email — nothing happens without it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
