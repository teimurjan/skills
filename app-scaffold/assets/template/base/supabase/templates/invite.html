<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>You’ve been invited to Appname</title>
</head>
<body style="margin:0;padding:0;background:#fafafa;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">A Appname account is waiting for {{ .Email }}.</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#fafafa;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 4px 16px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;letter-spacing:-0.01em;color:#0a0a0a;">Appname</td>
        </tr>
        <tr>
          <td style="background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;padding:28px 24px;">
            <p style="margin:0 0 8px;font-family:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#737373;">Invitation</p>
            <p style="margin:0 0 20px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#525252;">A Appname account has been set up for <span style="color:#0a0a0a;">{{ .Email }}</span>. Tap the button to accept it and sign in.</p>
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=invite" style="display:block;padding:15px 20px;border-radius:8px;background:#0f62fe;color:#ffffff;text-decoration:none;text-align:center;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:500;line-height:22px;">Accept invitation</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#737373;">Not expecting this? Ignore this email — nothing happens without it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
